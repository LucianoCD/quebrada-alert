[project]
name = "quebrada-alert"
version = "0.1.0"
description = "Telemetría hidrológica edge-first para alerta temprana de crecidas súbitas (demo con datos simulados)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "duckdb>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
geo = ["pysheds>=0.4", "rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["quebrada*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".agents", ".claude", ".devin", "cerebro"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
